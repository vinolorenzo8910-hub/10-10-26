<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satu nama di antara jutaan bintang</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,500&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5e9ee;--ink:#2b1630;--muted:#7c657f;--star:#5d2a56;--line:#c0446e;--n1:rgba(192,68,110,.12);--n2:rgba(93,42,86,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d0a1e;--ink:#f6ece6;--muted:#a99bb8;--star:#fff0dc;--line:#f0a9b4;--n1:rgba(240,169,180,.10);--n2:rgba(110,100,225,.16)}
}
:root[data-theme="dark"]{--bg:#0d0a1e;--ink:#f6ece6;--muted:#a99bb8;--star:#fff0dc;--line:#f0a9b4;--n1:rgba(240,169,180,.10);--n2:rgba(110,100,225,.16)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(70% 45% at 22% 18%,var(--n1),transparent 70%),radial-gradient(60% 40% at 82% 68%,var(--n2),transparent 70%),var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{z-index:3;position:fixed;left:0;right:0;bottom:0;padding:0 1.5rem calc(2.25rem + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none}
#ui>*{pointer-events:auto}
#t{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.6rem,5.6vw,2.5rem);line-height:1.2;margin:0 auto;max-width:20ch;transition:opacity .7s}
#p{color:var(--muted);margin:.8rem auto 0;line-height:1.55;max-width:34ch;min-height:1.55em;transition:opacity .7s}
.out{opacity:0}
.actions{margin-top:1.6rem;display:flex;flex-wrap:wrap;gap:1rem 1.5rem;justify-content:center;align-items:center;min-height:3rem}
button{font:inherit;cursor:pointer;border:0}
.solid{background:var(--ink);color:var(--bg);padding:.85rem 1.8rem;border-radius:2px;font-weight:600}
.quiet{background:none;color:var(--muted);text-decoration:underline;text-underline-offset:.3em;padding:.85rem 0}
#yes{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#snd{z-index:3;position:fixed;right:1rem;top:calc(.6rem + env(safe-area-inset-top,0px));font-size:.85rem;padding:.6rem}
a.solid{display:inline-block;text-decoration:none}
button:hover,a.solid:hover{opacity:.88}
button:focus-visible{outline:2px solid var(--line);outline-offset:4px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#flash{position:fixed;inset:0;background:var(--star);opacity:0;pointer-events:none;z-index:4}
.rv{display:inline-block;opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
body::before,body::after{content:"";position:fixed;width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;z-index:-1;opacity:.15}
body::before{background:radial-gradient(circle,var(--line),transparent 65%);left:-20vmax;top:-25vmax;animation:drift1 26s ease-in-out infinite alternate}
body::after{background:radial-gradient(circle,var(--muted),transparent 65%);right:-25vmax;bottom:-30vmax;animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,12vmax) scale(1.2)}}
@keyframes drift2{to{transform:translate(-16vmax,-10vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}.rv{animation:none;opacity:1}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#t,#p{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash"></div>
<button class="quiet" id="snd" hidden>Suara: nyala</button>
<div id="ui">
  <h1 id="t"></h1>
  <p id="p"></p>
  <div class="actions">
    <button class="solid" id="go">Mulai</button>
    <button class="solid" id="yes" hidden>Iya, aku mau</button>
    <button class="quiet" id="wait" hidden>Aku butuh waktu</button>
    <a class="solid" id="kirim" href="#" target="_blank" rel="noopener" hidden>Kirim jawabanku</a>
    <a class="quiet" id="kirim2" href="#" target="_blank" rel="noopener" hidden>Tidak terbuka? Buka profilku</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Ganti KAMU dengan namamu (opsional) dan sesuaikan kalimat di STEPS. */
const DIA = "Jelita"; /* nama panggilan, dipakai di kalimat */
const FULL = "Jelita Devi Silalahi"; /* nama lengkap, dipakai di tulisan bintang dan pesan jawaban */
const NAME2 = FULL.split(" ").length > 2 ? FULL.slice(0, FULL.lastIndexOf(" ")) + "\n" + FULL.slice(FULL.lastIndexOf(" ") + 1) : FULL;
const KAMU = "";
const WA = ""; /* nomor WhatsApp-mu, tanpa + dan tanpa 0 di depan, mis. 6281234567890 */
const IG = "kinozel"; /* username Instagram-mu tanpa @, mis. budi.santoso (diutamakan di atas WA) */
const STEPS = [
  {s:"nebula", t:"Ada sesuatu yang ingin kukatakan.", p:"Nyalakan suara, lalu lihat ke langit.", b:"Mulai"},
  {s:"name",   t:"Satu nama di antara jutaan bintang.", p:"Jelita berarti indah, dan Devi berarti dewi. Namamu memang tepat.", b:"Lanjut"},
  {s:"heart",  t:"Tapi itu bukan alasan utamanya.", p:"Aku suka caramu menjadi dirimu sendiri.", b:"Lanjut"},
  {s:"heart",  t:"Sejak mengenalmu, langit terasa lebih dekat.", p:"Dan aku ingin tetap dekat.", b:"Lanjut"},
  {s:"ask",    t:DIA + ",", p:"Aku ingin terus menyusun langit bersamamu. Tahan jarimu pada tombol untuk menjawab.", ask:true}
];
const $ = id => document.getElementById(id);
if (/Instagram|FBAN|FBAV/i.test(navigator.userAgent)) STEPS[0].p = "Untuk suara dan efek terbaik, buka lewat Chrome atau Safari (titik tiga, lalu Buka di browser).";
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
let step = 0, shape = "nebula", answered = null, mute = false;

/* Suara */
const SC = [392, 440, 523.25, 587.33, 659.25];
let AC, master;
function audio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .55;
    const d = AC.createDelay(); d.delayTime.value = .34;
    const fb = AC.createGain(); fb.gain.value = .4;
    d.connect(fb); fb.connect(d); master.connect(AC.destination); master.connect(d); d.connect(AC.destination);
  } catch (e) { AC = null; }
}
function note(f, when, dur, vol){
  if (!AC || mute) return;
  const t = AC.currentTime + (when || 0);
  for (const [type, m, v] of [["sine", 1, 1], ["triangle", 2, .22]]){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f * m;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((vol || .15) * v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + (dur || 1.8));
    o.connect(g); g.connect(master); o.start(t); o.stop(t + (dur || 1.8) + .05);
  }
}
function chord(fs, dur){ fs.forEach(f => note(f, 0, dur, .1)); }
/* Musik latar: progresi akor lembut yang diputar berulang */
const PROG = [
  [130.81, [261.63, 329.63, 392, 523.25]], [98, [246.94, 293.66, 392, 493.88]],
  [110, [261.63, 329.63, 440, 523.25]], [82.41, [246.94, 329.63, 392, 493.88]],
  [87.31, [261.63, 349.23, 440, 523.25]], [130.81, [261.63, 329.63, 392, 523.25]],
  [87.31, [261.63, 349.23, 440, 523.25]], [98, [246.94, 293.66, 392, 587.33]]
];
const PAT = [0, 1, 2, 3, 2, 1, 2, 3];
let musicT = null, tick = 0;
function music(){
  if (musicT || !AC) return;
  musicT = setInterval(() => {
    if (document.hidden || !AC) return;
    if (AC.state === "suspended") AC.resume();
    const c = PROG[Math.floor(tick / 8) % PROG.length], i = tick % 8;
    if (i === 0) note(c[0], 0, 4, .09);
    note(c[1][PAT[i]], 0, 1.8, i === 4 ? .075 : .05);
    tick++;
  }, 480);
}
document.addEventListener("pointerdown", () => { audio(); if (AC && AC.state === "suspended") AC.resume(); }, {passive: true});

/* Galaksi partikel (three.js) */
const COUNT = innerWidth < 700 ? 3400 : 5200;
let rend, cam, group, mat, geom, pos, spd, ph, T = {}, px = 0, py = 0, VW = 16, VH = 24, hold = 0, ptr = null;
const VS = "attribute float size;attribute float tint;varying float vT;uniform float uS;void main(){vT=tint;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*uS*(22.0/-mv.z);gl_Position=projectionMatrix*mv;}";
const FS = "uniform vec3 uA;uniform vec3 uB;varying float vT;void main(){float d=length(gl_PointCoord-vec2(.5));if(d>.5)discard;float a=pow(1.0-d*2.0,1.6);gl_FragColor=vec4(mix(uA,uB,vT),a);}";

function initGL(){
  if (typeof THREE === "undefined") return;
  rend = new THREE.WebGLRenderer({canvas: $("c"), alpha: true, antialias: false});
  rend.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  cam = new THREE.PerspectiveCamera(50, 1, .1, 100); cam.position.z = 22;
  const scene = new THREE.Scene(); group = new THREE.Group(); scene.add(group);
  pos = new Float32Array(COUNT * 3); spd = new Float32Array(COUNT); ph = new Float32Array(COUNT);
  const size = new Float32Array(COUNT), tint = new Float32Array(COUNT);
  for (let i = 0; i < COUNT; i++){
    const r = 28 + Math.random() * 14, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(b) * Math.cos(a); pos[i*3+1] = r * Math.sin(b) * Math.sin(a); pos[i*3+2] = r * Math.cos(b);
    size[i] = Math.random() * 1.4 + .5; tint[i] = Math.random(); spd[i] = .012 + Math.random() * .035; ph[i] = Math.random() * 6.283;
  }
  geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geom.setAttribute("size", new THREE.BufferAttribute(size, 1));
  geom.setAttribute("tint", new THREE.BufferAttribute(tint, 1));
  mat = new THREE.ShaderMaterial({uniforms:{uA:{value:new THREE.Color()}, uB:{value:new THREE.Color()}, uS:{value:1}}, vertexShader:VS, fragmentShader:FS, transparent:true, depthWrite:false});
  group.add(new THREE.Points(geom, mat));
  rend.userScene = scene;
  resize(); theme();
  addEventListener("resize", resize);
  const setPtr = e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; ptr = {x: px * VW, y: -py * VH}; };
  addEventListener("pointermove", setPtr, {passive: true});
  addEventListener("pointerdown", setPtr, {passive: true});
  addEventListener("pointerup", () => { ptr = null; });
  addEventListener("pointercancel", () => { ptr = null; });
}
function theme(){
  if (!mat) return;
  const cs = getComputedStyle(document.documentElement), bgc = new THREE.Color(cs.getPropertyValue("--bg").trim());
  const dark = (bgc.r + bgc.g + bgc.b) / 3 < .5;
  mat.uniforms.uA.value.set(cs.getPropertyValue("--star").trim());
  mat.uniforms.uB.value.set(cs.getPropertyValue("--line").trim());
  const bl = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
  if (mat.blending !== bl){ mat.blending = bl; mat.needsUpdate = true; }
}
function resize(){
  if (!rend) return;
  rend.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  mat.uniforms.uS.value = rend.getPixelRatio() * innerHeight / 330;
  build(); if (calm) snap();
}
function textT(str, wMax, frac, vw, vh, up){
  const out = new Float32Array(COUNT * 3);
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  cv.width = 900; cv.height = 260;
  const L = str.split("\n");
  let sz = L.length > 1 ? 104 : 190;
  const fnt = () => "italic 500 " + sz + "px 'Bodoni Moda',Georgia,serif";
  const wid = () => Math.max(...L.map(l => g.measureText(l).width));
  g.font = fnt(); while (wid() > 860 && sz > 40){ sz -= 6; g.font = fnt(); }
  const tw = wid(), lh = sz * 1.08;
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  L.forEach((l, i) => g.fillText(l, 450, 135 + (i - (L.length - 1) / 2) * lh));
  const d = g.getImageData(0, 0, 900, 260).data, P = [];
  for (let y = 0; y < 260; y += 2) for (let x = 0; x < 900; x += 2) if (d[(y * 900 + x) * 4 + 3] > 128) P.push(x, y);
  const k = wMax / Math.max(tw, 1), n = P.length / 2, cnt = Math.floor(COUNT * frac);
  for (let i = 0; i < COUNT; i++){
    const j = i * 3;
    if (i < cnt && n){ const q = Math.floor(Math.random() * n) * 2; out[j] = (P[q] - 450) * k; out[j+1] = -(P[q+1] - 135) * k + up; out[j+2] = (Math.random() - .5) * .8; }
    else { out[j] = (Math.random() - .5) * vw * .95; out[j+1] = (Math.random() - .5) * vh * .8 + up; out[j+2] = (Math.random() - .5) * 6; }
  }
  return out;
}
function build(){
  const vh = 2 * 22 * Math.tan(25 * Math.PI / 180), vw = vh * innerWidth / innerHeight, up = vh * .1;
  VW = vw; VH = vh;
  const nb = new Float32Array(COUNT * 3), ht = new Float32Array(COUNT * 3), nm = new Float32Array(COUNT * 3), bs = new Float32Array(COUNT * 3);
  const R = Math.max(5, Math.min(vw * .55, 10)), hs = Math.min(vw * .8, 13) / 32;
  for (let i = 0; i < COUNT; i++){
    const j = i * 3;
    const r = Math.pow(Math.random(), .6) * R, a = (i % 3) * 2.094 + r * .55 + (Math.random() - .5) * .7;
    nb[j] = Math.cos(a) * r; nb[j+1] = Math.sin(a) * r * .55 + up; nb[j+2] = (Math.random() - .5) * 3;
    const t = Math.random() * 6.283, k = Math.random() < .55 ? 1 + (Math.random() - .5) * .06 : Math.sqrt(Math.random());
    ht[j] = hs * 16 * Math.pow(Math.sin(t), 3) * k;
    ht[j+1] = hs * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t) + 2.5) * k + up;
    ht[j+2] = (Math.random() - .5) * 1.4;
    const u = Math.random() * 6.283, v = Math.acos(2 * Math.random() - 1), rr = 10 + Math.random() * 22;
    bs[j] = rr * Math.sin(v) * Math.cos(u); bs[j+1] = rr * Math.sin(v) * Math.sin(u); bs[j+2] = rr * Math.cos(v);
  }
  const wM = Math.min(vw * .86, 15);
  T = {nebula: nb, heart: ht, name: textT(NAME2, wM, .75, vw, vh, up), burst: bs, ask: textT("Jadi pacarku?", wM, .8, vw, vh, up),
       date: textT(new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"}), wM, .75, vw, vh, up)};
}
function snap(){ if (rend){ pos.set(T[shape]); draw(0); } }
function draw(t){
  const tg = T[shape]; if (!tg) return;
  if (!calm){
    const boost = shape === "burst" ? 1.6 : 1;
    for (let i = 0; i < COUNT; i++){
      const j = i * 3, k = spd[i] * boost, s = Math.sin(t / 700 + ph[i]) * (.06 + hold * .45);
      pos[j] += (tg[j] + s - pos[j]) * k; pos[j+1] += (tg[j+1] + s - pos[j+1]) * k; pos[j+2] += (tg[j+2] - pos[j+2]) * k;
      if (ptr){ const dx = pos[j] - ptr.x, dy = pos[j+1] - ptr.y, d2 = dx * dx + dy * dy; if (d2 < 3.5){ const d = Math.sqrt(d2) || .01, f = (1 - d / 1.87) * .5; pos[j] += dx / d * f; pos[j+1] += dy / d * f; } }
    }
    geom.attributes.position.needsUpdate = true;
    group.rotation.z = shape === "nebula" ? group.rotation.z + .0015 : group.rotation.z * .94;
    const sc = (shape === "heart" ? 1 + .03 * Math.pow(Math.sin(t / 340) * .5 + .5, 8) : 1) - hold * .1 + hold * .015 * Math.sin(t / 55);
    group.scale.setScalar(group.scale.x + (sc - group.scale.x) * .2);
    cam.position.x += (px * 2.4 - cam.position.x) * .03; cam.position.y += (-py * 2.4 - cam.position.y) * .03;
    cam.lookAt(0, 0, 0);
    if ((t | 0) % 97 < 17) theme();
  } else geom.attributes.position.needsUpdate = true;
  rend.render(rend.userScene, cam);
}
function frame(t){ draw(t); requestAnimationFrame(frame); }

/* Alur cerita */
const T1 = $("t"), P1 = $("p");
function setText(el, s){
  el.textContent = "";
  if (calm){ el.textContent = s; return; }
  let n = 0;
  s.split(" ").forEach((w, wi, arr) => {
    const ws = document.createElement("span"); ws.style.cssText = "display:inline-block;white-space:nowrap";
    [...w].forEach(ch => { const sp = document.createElement("span"); sp.className = "rv"; sp.textContent = ch; sp.style.animationDelay = (n++ * 26) + "ms"; ws.appendChild(sp); });
    el.appendChild(ws); if (wi < arr.length - 1) el.appendChild(document.createTextNode(" "));
  });
}
function show(a, b, done){
  T1.classList.add("out"); P1.classList.add("out");
  setTimeout(() => { setText(T1, a); setText(P1, b); T1.classList.remove("out"); P1.classList.remove("out"); if (done) done(); }, calm ? 0 : 650);
}
function btns(...ids){ for (const id of ["go", "yes", "wait", "kirim"]) $(id).hidden = !ids.includes(id); if ($("kirim2")) $("kirim2").hidden = $("kirim").hidden; }
function go(i){
  const prev = shape; step = i; const S = STEPS[i]; shape = S.s; fxStep(prev, shape);
  if (i > 0 && !S.ask) note(SC[i % 5], 0, 2, .16);
  if (prev !== "heart" && shape === "heart") chord([261.63, 329.63, 392, 523.25], 3.5);
  btns(); if (calm) snap();
  show(S.t, S.p, () => { if (S.ask){ btns("yes", "wait"); $("yes").focus(); } else { $("go").textContent = S.b; btns("go"); } });
}
$("go").onclick = () => { if (step === 0){ audio(); music(); $("snd").hidden = false; if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } go(step + 1); };
const YES = () => {
  answered = "yes"; btns(); loveShow();
  [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, k) => note(f, k * .2, 3, .14));
  shape = "burst"; if (calm) snap(); else setTimeout(() => { shape = "heart"; }, 1300);
  show("Terima kasih, " + DIA + ".", KAMU ? "Mulai malam ini, galaksi ini punya dua nama: " + DIA + " dan " + KAMU + "." : "Mulai malam ini, langit ini kita jaga berdua.", () => btns("kirim"));
  if (!calm) setTimeout(() => { shape = "date"; show("Tanggal ini akan selalu kuingat.", "Kabari aku sekarang, ya.", () => btns("kirim")); }, 5200);
};
$("wait").onclick = () => {
  answered = "wait"; btns(); if (!calm) for (let k = 0; k < 4; k++) setTimeout(() => meteors.push({x: FW * (.4 + Math.random() * .6), y: -10, vx: -6, vy: 3.5, l: 1}), k * 600); chord([196, 261.63, 329.63], 4);
  shape = "nebula"; if (calm) snap();
  show("Tidak apa-apa.", "Ambil waktu yang kamu perlu. Langit akan tetap di sini, begitu juga aku.", () => btns("kirim"));
};
/* Kirim jawaban ke pembuat halaman: tautan asli, jadi tidak diblokir popup */
const KB = $("kirim");
KB.textContent = IG ? "Kirim jawabanku ke Instagram" : WA ? "Kirim jawabanku lewat WhatsApp" : (navigator.share ? "Bagikan jawabanku" : "Salin jawabanku");
KB.href = IG ? "https://ig.me/m/" + IG : "#";
$("kirim2").href = IG ? "https://www.instagram.com/" + IG + "/" : "#";
if (!IG) $("kirim2").remove();
KB.onclick = e => {
  const msg = answered === "yes" ? "Iya, aku mau. Dari " + FULL : "Aku butuh waktu dulu ya. Dari " + FULL;
  const copy = () => { try { navigator.clipboard.writeText(msg).catch(() => {}); KB.textContent = "Tersalin. Tempel di chat lalu kirim"; } catch (x) {} };
  if (IG){ copy(); KB.href = "https://ig.me/m/" + IG; }
  else if (WA){ KB.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg); }
  else { e.preventDefault(); if (navigator.share) navigator.share({text: msg}).catch(() => {}); else copy(); }
};
/* Tahan untuk mengiyakan: bintang bergetar, nada naik, lalu meledak */
const Y = $("yes"); Y.textContent = "Tahan untuk menjawab iya";
let hT = null, hS = 0, hN = -1;
function holdEnd(done){
  clearInterval(hT); hT = null; hold = 0; hN = -1; Y.style.background = "";
  if (done) YES();
}
Y.addEventListener("pointerdown", () => {
  if (hT || answered) return;
  hS = performance.now();
  hT = setInterval(() => {
    hold = Math.min(1, (performance.now() - hS) / 1700);
    Y.style.background = "linear-gradient(90deg,var(--line) " + hold * 100 + "%,var(--ink) " + hold * 100 + "%)";
    if (navigator.vibrate && Math.random() < .35) navigator.vibrate(18);
    const n = Math.floor(hold * 8);
    if (n !== hN){ hN = n; note(SC[n % 5] * (n > 4 ? 1.5 : 1), 0, 1.3, .1); }
    if (hold >= 1) holdEnd(true);
  }, 40);
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev => Y.addEventListener(ev, () => { if (hT) holdEnd(false); }));
Y.addEventListener("contextmenu", e => e.preventDefault());
Y.onclick = e => { if (e.detail === 0) YES(); };
addEventListener("deviceorientation", e => {
  if (e.gamma == null) return;
  px = Math.max(-.5, Math.min(.5, e.gamma / 60)); py = Math.max(-.5, Math.min(.5, (e.beta - 45) / 90));
}, {passive: true});
$("snd").onclick = () => { mute = !mute; $("snd").textContent = "Suara: " + (mute ? "mati" : "nyala"); };

/* Efek tambahan: meteor, riak sentuhan, jejak jari, kembang api, hati melayang */
const fx = $("fx"), fc = fx.getContext("2d");
let FW = 0, FH = 0, sparks = [], rings = [], meteors = [], hearts = [], trail = [], heartsUntil = 0, nextMet = 1200, ft = 0, cs = {star: "#fff0dc", line: "#f0a9b4"};
function fxSize(){ const d = Math.min(devicePixelRatio || 1, 2); FW = innerWidth; FH = innerHeight; fx.width = FW * d; fx.height = FH * d; fc.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", fxSize); fxSize();
function burst(x, y, n, sp, g, life){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, v = sp * (.3 + Math.random() * .7);
    sparks.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, l: 1, d: 1 / (life * (.7 + Math.random() * .6)), c: Math.random() < .5 ? 0 : 1});
  }
}
function firework(x, y, n){ burst(x, y, n || 70, 5.5, .05, 70); rings.push({x, y, r: 0, l: 1}); }
function heartPath(x, y, s){
  const w = s, h = s * .9, t = h * .3;
  fc.beginPath(); fc.moveTo(x, y + t);
  fc.bezierCurveTo(x, y, x - w / 2, y, x - w / 2, y + t);
  fc.bezierCurveTo(x - w / 2, y + (h + t) / 2, x, y + (h + t) / 2, x, y + h);
  fc.bezierCurveTo(x, y + (h + t) / 2, x + w / 2, y + (h + t) / 2, x + w / 2, y + t);
  fc.bezierCurveTo(x + w / 2, y, x, y, x, y + t);
  fc.closePath();
}
function fxFrame(now){
  requestAnimationFrame(fxFrame);
  if (ft++ % 40 === 0){ const st = getComputedStyle(document.documentElement); cs.star = st.getPropertyValue("--star").trim() || cs.star; cs.line = st.getPropertyValue("--line").trim() || cs.line; }
  fc.clearRect(0, 0, FW, FH);
  if (now > nextMet){ meteors.push({x: FW * (.3 + Math.random() * .8), y: -10, vx: -(5 + Math.random() * 4), vy: 3 + Math.random() * 2, l: 1}); nextMet = now + 2800 + Math.random() * 4500; }
  if (now < heartsUntil && Math.random() < .22) hearts.push({x: Math.random() * FW, y: FH + 20, vy: -(1 + Math.random() * 1.6), p: Math.random() * 6.28, s: 10 + Math.random() * 16});
  fc.shadowColor = cs.line; fc.shadowBlur = 8; fc.lineCap = "round";
  meteors = meteors.filter(m => m.l > 0 && m.y < FH + 40);
  for (const m of meteors){
    m.x += m.vx; m.y += m.vy; m.l -= .004;
    for (let k = 0; k < 10; k++){
      fc.globalAlpha = Math.max(0, m.l) * (1 - k / 10) * .8; fc.strokeStyle = cs.star; fc.lineWidth = 2 - k * .15;
      fc.beginPath(); fc.moveTo(m.x - m.vx * k * 1.6, m.y - m.vy * k * 1.6); fc.lineTo(m.x - m.vx * (k + 1) * 1.6, m.y - m.vy * (k + 1) * 1.6); fc.stroke();
    }
  }
  sparks = sparks.filter(p => p.l > 0);
  for (const p of sparks){
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.l -= p.d;
    fc.globalAlpha = Math.max(0, p.l); fc.fillStyle = p.c ? cs.line : cs.star;
    fc.beginPath(); fc.arc(p.x, p.y, 1.8, 0, 6.283); fc.fill();
  }
  rings = rings.filter(r => r.l > 0);
  for (const r of rings){ r.r += 5; r.l -= .03; fc.globalAlpha = Math.max(0, r.l) * .6; fc.strokeStyle = cs.line; fc.lineWidth = 1.5; fc.beginPath(); fc.arc(r.x, r.y, r.r, 0, 6.283); fc.stroke(); }
  trail = trail.filter(q => q.l > 0);
  for (const q of trail){ q.l -= .04; fc.globalAlpha = Math.max(0, q.l); fc.fillStyle = cs.star; fc.beginPath(); fc.arc(q.x, q.y, 2 * q.l + .5, 0, 6.283); fc.fill(); }
  hearts = hearts.filter(h => h.y > -30);
  for (const h of hearts){ h.y += h.vy; h.p += .03; fc.globalAlpha = .75; fc.fillStyle = cs.line; heartPath(h.x + Math.sin(h.p) * 18, h.y, h.s); fc.fill(); }
  fc.globalAlpha = 1;
}
function fxStep(prev, now){
  if (calm || prev === now) return;
  if (now === "name") firework(FW / 2, FH * .3, 50);
  else if (now === "heart"){ firework(FW * .3, FH * .28, 40); setTimeout(() => firework(FW * .7, FH * .28, 40), 350); }
  else if (now === "ask") for (let k = 0; k < 3; k++) setTimeout(() => meteors.push({x: FW * (.5 + Math.random() * .5), y: -10, vx: -7, vy: 4, l: 1}), k * 300);
}
function loveShow(){
  if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 200]);
  if (calm) return;
  const f = $("flash"); f.style.transition = "none"; f.style.opacity = .6;
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = "opacity 1.4s ease-out"; f.style.opacity = 0; }));
  for (let k = 0; k < 9; k++) setTimeout(() => firework(FW * (.15 + Math.random() * .7), FH * (.12 + Math.random() * .4), 70), k * 420);
  heartsUntil = performance.now() + 9000;
}
addEventListener("pointerdown", e => {
  if (calm || (e.target.closest && e.target.closest("button,a"))) return;
  rings.push({x: e.clientX, y: e.clientY, r: 0, l: 1}); burst(e.clientX, e.clientY, 14, 3, .04, 45);
});
addEventListener("pointermove", e => {
  if (calm || (e.pointerType !== "mouse" && !e.buttons)) return;
  trail.push({x: e.clientX, y: e.clientY, l: 1}); if (trail.length > 60) trail.shift();
}, {passive: true});
if (!calm) requestAnimationFrame(fxFrame);

initGL();
if (rend){ if (calm) snap(); else requestAnimationFrame(frame); }
if (document.fonts && document.fonts.load) document.fonts.load("italic 500 100px 'Bodoni Moda'").then(() => { if (rend){ build(); if (calm) snap(); } }).catch(() => {});
go(0);
</script>
